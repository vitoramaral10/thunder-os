# Kernel sem a mount API nova (open_tree/move_mount, Linux 5.2): com PrivateNetwork=yes o
# executor monta um sysfs novo e leva o /sys/fs/cgroup do sistema para dentro dele com
# open_tree(); sem a syscall (ENOSYS) o cgroupfs nao chega, e o bind de leitura e escrita
# do memory.pressure da unit (MemoryPressureWatch=auto, junto de ProtectControlGroups=yes)
# falha: 226/NAMESPACE em polkit, hostnamed, localed, nm-priv-helper, seatd, shadow,
# fstrim, coredumpd... Sem o watch o executor nao pede esse bind; o servico so deixa de
# receber o aviso de pressao de memoria (o sd-event usa para liberar cache), e o PSI do
# kernel continua em /proc/pressure.
#
# Instalado pelo rootfs/configure.sh em /usr/lib/systemd/system/service.d/ e em
# /usr/lib/systemd/user/service.d/ (o systemd --user falha igual) so quando o kernel do
# aparelho (KVER) e anterior ao 5.2. Ordem e opt-out: ver
# zz-thunder-no-credentials.conf (ln -s /dev/null
# /etc/systemd/system/<unit>.d/zz-thunder-no-memory-pressure.conf).
[Service]
MemoryPressureWatch=off

# Kernel sem procfs com opcoes por montagem (hidepid=invisible, subset=pid: Linux 5.8):
# toda unit com ProtectProc=/ProcSubset= morre com 226/NAMESPACE (hostnamed, localed,
# timedated, timesyncd, userdbd, shadow, archlinux-keyring-wkd-sync...). Volta ao padrao:
# a unit ve o /proc do sistema. O ultimo valor vale.
#
# Instalado pelo rootfs/configure.sh em /usr/lib/systemd/system/service.d/ so quando o
# kernel do aparelho (KVER) e anterior ao 5.8. Ordem e opt-out: ver
# zz-thunder-no-credentials.conf (ln -s /dev/null
# /etc/systemd/system/<unit>.d/zz-thunder-no-protectproc.conf).
# So no gerente do sistema: o systemd --user ignora ProtectProc=/ProcSubset= sem erro.
[Service]
ProtectProc=default
ProcSubset=all

# Kernel sem a mount API nova (fsopen/fsconfig/fsmount/move_mount, Linux 5.2): toda unit
# com credenciais morre com 243/CREDENTIALS antes do ExecStart (journald, getty@,
# tmpfiles-*, sysusers, sysctl, vconsole-setup, fsck, udev-load-credentials, sshd@...).
# Atribuicao vazia zera a lista; sem credenciais o executor nem tenta montar o diretorio.
#
# Instalado pelo rootfs/configure.sh em /usr/lib/systemd/system/service.d/ e em
# /usr/lib/systemd/user/service.d/ (o systemd --user falha igual) so quando o kernel do
# aparelho (KVER) e anterior ao 5.2. Drop-in de tipo (service.d): vale para todos os
# servicos. Os drop-ins sao aplicados em ordem do nome do arquivo, de todos os
# diretorios juntos; "zz-" fica depois dos nomes usuais (10-*, 50-*, override.conf),
# entao estes valores sao os finais. Para tirar uma unit daqui: ln -s /dev/null
# /etc/systemd/system/<unit>.d/zz-thunder-no-credentials.conf (de usuario:
# /etc/systemd/user/<unit>.d/ ou ~/.config/systemd/user/<unit>.d/).
[Service]
ImportCredential=
LoadCredential=
LoadCredentialEncrypted=
SetCredential=
SetCredentialEncrypted=

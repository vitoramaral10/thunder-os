# O que o kernel do Arch de PC ja traz na config e os kernels de fabricante nao: o
# dmesg so para root (CONFIG_SECURITY_DMESG_RESTRICT) e eBPF so para root
# (CONFIG_BPF_UNPRIV_DEFAULT_OFF). O log do kernel de fabricante entrega enderecos e
# estado de driver; o verificador de eBPF de kernel antigo e porta conhecida para root.
# Num kernel que nao reabre o eBPF (4.19), o 1 vale ate o proximo boot.
kernel.dmesg_restrict = 1
kernel.unprivileged_bpf_disabled = 1

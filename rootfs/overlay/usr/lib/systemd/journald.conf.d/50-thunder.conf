# Journal no disco (/var/log/journal) desde o 1o boot, gravado a cada 30 s em vez de
# 5 min: num reset por travamento perde-se no maximo 30 s. O console do kernel do boot
# anterior (pstore/ramoops) vai para /var/lib/systemd/pstore pelo systemd-pstore.service.
[Journal]
Storage=persistent
SyncIntervalSec=30s
SystemMaxUse=512M
SystemMaxFileSize=32M

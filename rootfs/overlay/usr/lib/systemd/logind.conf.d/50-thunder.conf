# Telefone: o botao de energia nao desliga com um toque. O 70-power-switch.rules do
# systemd marca como power-switch todo dispositivo de entrada com tecla, e o padrao do
# logind e HandlePowerKey=poweroff. Segurar o botao (5 s) desliga limpo; o PMIC forca o
# reset mais tarde. Sem tampa: o sensor hall de capa nao suspende nada.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
HandleSuspendKey=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore

# NetworkManager do Thunder OS. So a interface Wi-Fi de estacao do aparelho e dele:
# 51-thunder-wifi.conf, ao lado deste, e gerado pelo rootfs/configure.sh com o
# WIFI_INTERFACE do device.sh ("unmanaged-devices=except:interface-name:<if>", que
# equivale a "*,except:..."). Ficam de fora o cabo USB (rndis*/usb*, 172.16.42.1, do
# thunder-usb-network.service), o modem (ccmni*) e as interfaces extras do driver; a
# regra 90-thunder-nm-unmanaged.rules do udev repete isso para o cabo e o modem.
[main]
# Sem systemd-resolved: o NM escreve o /etc/resolv.conf.
dns=default
rc-manager=file

[device-thunder-wifi]
match-device=type:wifi
# iwd depois: precisa de AF_ALG/crypto do kernel. Trocar esta linha.
wifi.backend=wpa_supplicant

[connection-thunder-wifi]
match-device=type:wifi
# MAC localmente administrado, fixo por rede (hash do /var/lib/NetworkManager/secret_key
# e do SSID). "stable-ssid" e nao "stable": o thunder-wifi connect recria o perfil (UUID
# nova), e "stable" depende da UUID, entao o MAC e o IP dado pelo roteador mudariam a
# cada reconexao.
wifi.cloned-mac-address=stable-ssid

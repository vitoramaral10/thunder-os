# Nos que o kernel Android cria escreviveis por qualquer um (0666/0222) e que no Android
# o SELinux fecha: sem ele, qualquer usuario apagava as estatisticas por UID, mudava o
# estado de UID do cpufreq e mexia no sdcardfs. Ficam so para root. "z" so ajusta o que
# existe: kernel sem esses nos nao reclama.
z /proc/uid_cputime/remove_uid_range        0220 root root -
z /proc/uid_procstat/set                    0220 root root -
z /sys/kernel/config/sdcardfs/remove_userid 0220 root root -

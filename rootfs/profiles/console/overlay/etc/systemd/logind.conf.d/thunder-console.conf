# Perfil console: o botao power (mtk-kpd, marcado power-switch) desligava o aparelho no
# primeiro toque (padrao do logind: HandlePowerKey=poweroff). Toque curto agora so conta
# como atividade e acende a tela apagada pelo swayidle (console-session); desligar e
# segurar o botao.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff

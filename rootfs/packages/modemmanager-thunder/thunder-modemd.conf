# ModemManager so depois do modem MediaTek pronto.
#
# O thunder-modemd (Type=notify) so avisa o systemd quando o MD1 chegou a READY e
# recebeu a hora. Antes disso o /dev/ttyC0 pode existir sem o modem responder AT: o
# ModemManager sonda a porta, nao recebe resposta, descarta o aparelho e so tenta de
# novo num proximo evento do udev (ou mmcli --scan-modems). After= faz o ModemManager
# esperar o READY; Wants= sobe o thunder-modemd junto com ele.
#
# Wants e nao Requires/BindsTo: sem o modem (copia da NVRAM nao semeada, kernel sem o
# eccci, outro aparelho) o ModemManager continua de pe para os outros modems. Uma
# reinicializacao do MD pelo thunder-modemd nao reinicia o ModemManager.
[Unit]
Wants=thunder-modemd.service
After=thunder-modemd.service

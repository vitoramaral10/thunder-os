# Drop-in do bluetooth.service (thunder-mediatek-wmt): o bluetoothd so sobe depois que o
# thunder-wmt-bt gravou e conferiu o endereco BT de fabrica. Se ele falhar, o Bluetooth fica
# desligado em vez de usar o endereco provisorio da MediaTek, igual em todo aparelho.
# Aparelho sem WMT: a thunder-wmt-bt e pulada pela ConditionPathExists, e isso conta como
# sucesso para o Requires=.
[Unit]
Requires=thunder-wmt-bt.service
After=thunder-wmt-bt.service

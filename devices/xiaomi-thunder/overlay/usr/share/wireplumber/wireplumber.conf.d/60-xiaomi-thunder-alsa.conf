# Thunder OS, xiaomi-thunder: sem o perfil "Pro Audio" no cartao do MT6833.
#
# O cartao tem ~40 PCMs, quase todos portas internas do DSP (hostless, VOW do SCP,
# BTCVSD com 255 canais), que nao servem como dispositivo de audio. Para montar o perfil
# Pro Audio o ACP abre todos eles; abrir o VOW_Capture (hw:0,50) ainda ligava o modo VOW
# do codec e deixava os microfones mudos ate o reboot (corrigido no kernel por
# fix-mt6359-vow-enable-stuck). O perfil HiFi vem do UCM (ucm2/conf.d/mt6833-mt6359).
monitor.alsa.rules = [
  {
    matches = [
      { api.alsa.card.name = "mt6833-mt6359" }
    ]
    actions = {
      update-props = {
        api.acp.disable-pro-audio = true
      }
    }
  }
]

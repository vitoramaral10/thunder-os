# Thunder OS, xiaomi-thunder: o WirePlumber ignora o decodificador de video do MT6833.
#
# /dev/video1 e o vdec (1602f000.vdec) do driver mtk-vcodec do vendor: o open() dele e
# negado (EPERM), e a ativacao do dispositivo no monitor v4l2 nunca termina. O hook
# assincrono travado segura a fila de eventos do WirePlumber: nenhum no de audio ganha
# item, nao ha saida padrao e todo stream fica parado. O vdec nao e camera; os outros
# nos V4L2 (DPE, codificadores de video e JPEG) sobem normalmente.
monitor.v4l2.rules = [
  {
    matches = [
      { device.sysfs.path = "~/devices/platform/1602f000.vdec/.*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]

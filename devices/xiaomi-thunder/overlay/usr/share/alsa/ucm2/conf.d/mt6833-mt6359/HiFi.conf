# Saidas no DL1 (hw:0,0, "Playback_1"), entradas no UL1 (hw:0,10, "Capture_1", VUL12).
# As rotas digitais DL1 -> ADDA e ADDA -> UL1 ficam no verbo: sao PCMs DPCM, e o
# hw_params do frontend falha (EINVAL) se nenhum backend estiver ligado, inclusive quando o
# PipeWire sonda o PCM antes de escolher um dispositivo. Nao ligam amplificador nenhum.

SectionVerb {
	EnableSequence [
		cset "name='DAC In Mux' Normal Path"
		cset "name='ADDA_UL_Mux' MTKAIF"
		cset "name='UL_SRC_MUX' AMIC"
		cset "name='MISO0_MUX' UL1_CH1"
		cset "name='MISO1_MUX' UL1_CH1"
		cset "name='ADDA_DL_CH1 DL1_CH1' 1"
		cset "name='ADDA_DL_CH2 DL1_CH2' 1"
		cset "name='UL1_CH1 ADDA_UL_CH1' 1"
		cset "name='UL1_CH2 ADDA_UL_CH2' 1"
	]
	DisableSequence [
		cset "name='ADDA_DL_CH1 DL1_CH1' 0"
		cset "name='ADDA_DL_CH2 DL1_CH2' 0"
		cset "name='UL1_CH1 ADDA_UL_CH1' 0"
		cset "name='UL1_CH2 ADDA_UL_CH2' 0"
	]
	Value {
		TQ "HiFi"
	}
}

# So o lineout esquerdo chega ao amplificador: o PCM abre em mono (o DL1 aceita) e o
# PipeWire faz o downmix; o canal 1 do DAC nao tem entrada para o DL1_CH2. O sia81xx liga
# e desliga pelo DAPM junto com o stream (LINEOUT L -> SpkrLeft IN, patch do kernel
# fix-sia81xx-speaker-amp-dapm): o UCM so escolhe a rota, nunca o "Sia81xx Power".
SectionDevice."Speaker" {
	Comment "Speaker"
	ConflictingDevice [
		"Headphones"
	]
	EnableSequence [
		cset "name='LOL Mux' Open"
		cset "name='Lineout_PGAL_GAIN',device=4 10"
		cset "name='Lineout_PGAR_GAIN',device=5 10"
		cset "name='LOL Mux' Playback_L_DAC"
		cset "name='SpkrLeft Sia81xx Audio Scene' Playback"
		cset "name='Ext_Speaker_Amp Switch' on"
	]
	DisableSequence [
		cset "name='Ext_Speaker_Amp Switch' off"
		cset "name='LOL Mux' Open"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 1
	}
}

# O accdet reporta o plugue nos jacks ALSA (patch do kernel add-accdet-alsa-jack): com o
# fone plugado, a prioridade maior leva o audio para ele; sem fone, a porta some.
SectionDevice."Headphones" {
	Comment "Headphones"
	ConflictingDevice [
		"Speaker"
	]
	EnableSequence [
		cset "name='HPL Mux' Open"
		cset "name='HPR Mux' Open"
		cset "name='Headset_PGAL_GAIN',device=2 9"
		cset "name='Headset_PGAR_GAIN',device=3 9"
		cset "name='HPL Mux' Audio Playback"
		cset "name='HPR Mux' Audio Playback"
	]
	DisableSequence [
		cset "name='HPL Mux' Open"
		cset "name='HPR Mux' Open"
	]
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		JackControl "Headphone Jack"
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphone"
	ConflictingDevice [
		"Headset"
	]
	EnableSequence [
		cset "name='PGA1 Volume' 2"
		cset "name='PGA_L_Mux' AIN0"
		cset "name='ADC_L_Mux' Left Preamplifier"
	]
	DisableSequence [
		cset "name='ADC_L_Mux' Idle"
		cset "name='PGA_L_Mux' None"
	]
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},10"
	}
}

SectionDevice."Headset" {
	Comment "Headset Microphone"
	ConflictingDevice [
		"Mic"
	]
	EnableSequence [
		cset "name='PGA1 Volume' 2"
		cset "name='PGA_L_Mux' AIN1"
		cset "name='ADC_L_Mux' Left Preamplifier"
	]
	DisableSequence [
		cset "name='ADC_L_Mux' Idle"
		cset "name='PGA_L_Mux' None"
	]
	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},10"
		JackControl "Headset Mic Jack"
	}
}

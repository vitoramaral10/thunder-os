# Thunder OS: Xiaomi Redmi 10 5G / POCO M4 5G (xiaomi-thunder), MT6833 + codec MT6359,
# amplificador sia81xx no lineout esquerdo. Rotas tiradas do audio_device.xml da ROM de
# fabrica (/vendor/etc), ganhos do PlaybackVolAna_AudioParam.xml.
#
# Volume so em software (PipeWire): os controles de volume analogico do MT6359
# ('Lineout Volume', 'Headset Volume') declaram a escala de dB invertida, e "0%" neles
# poe o hardware no maximo. Os ganhos ficam fixos nos valores de fabrica, pelos enums
# *_PGA*_GAIN (indice 0 = +8 dB ... 8 = 0 dB, 10 = -2 dB, 19 = mudo).
Syntax 6

SectionUseCase."HiFi" {
	File "HiFi.conf"
	Comment "Default"
}

# A cada boot (alsactl): amplificador e saidas desligados, ganhos seguros. O padrao do
# driver e +8 dB no lineout.
FixedBootSequence [
	cset "name='SpkrLeft Sia81xx Power' Off"
	cset "name='Ext_Speaker_Amp Switch' off"
	cset "name='LOL Mux' Open"
	cset "name='HPL Mux' Open"
	cset "name='HPR Mux' Open"
	cset "name='RCV Mux' Open"
	cset "name='Lineout_PGAL_GAIN',device=4 10"
	cset "name='Lineout_PGAR_GAIN',device=5 10"
	cset "name='Headset_PGAL_GAIN',device=2 9"
	cset "name='Headset_PGAR_GAIN',device=3 9"
]

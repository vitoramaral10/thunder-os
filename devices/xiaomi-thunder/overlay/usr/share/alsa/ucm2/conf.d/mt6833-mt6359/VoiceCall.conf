# Chamada de voz (CS) pelo MD1. So a parte analogica e as rotas do AP ficam aqui: o
# caminho do modem (as 4 chaves PCM_2_* / ADDA_DL_CHx PCM_2_CAP_CH1 e a FE
# Hostless_Speech) e do thunder-speechd, que liga e desliga junto com a voz no modem. Se o
# verbo mudar no meio da chamada, as rotas do MD nao somem debaixo do PCM aberto.
#
# NUNCA por o PCM Hostless_Speech (hw:0,23) num PlaybackPCM/CapturePCM: a FE nao tem
# buffer DMA, e tocar ou gravar nela (ou ler o status com ela rodando) derruba o kernel
# (build/xiaomi-thunder/modem-research/VOICE-AUDIO.md 3.3).
#
# Os PCMs abaixo sao os do HiFi (DL1 e UL1): toque e avisos do PipeWire durante a chamada
# saem pela mesma saida analogica. O uplink para a rede sai do ADDA UL, antes do UL1:
# Mic e Headset (PGA_L_Mux AIN0/AIN1) valem igual para o modem.
#
# Rotas e valores do audio_device.xml da ROM (receiver_output, speaker_output,
# ext_speaker_output) e da string do HAL que poe o sia81xx em "Voice" na chamada.

SectionVerb {
	# O mesmo bloco do HiFi.conf: muxes base e DL1 -> ADDA, ADDA -> UL1 (os PCMs do AP
	# sao DPCM: hw_params falha com EINVAL sem backend ligado).
	EnableSequence [
		cset "name='DAC In Mux' Normal Path"
		cset "name='ADDA_UL_Mux' MTKAIF"
		cset "name='UL_SRC_MUX' AMIC"
		cset "name='MISO0_MUX' UL1_CH1"
		cset "name='MISO1_MUX' UL1_CH1"
		cset "name='ADDA_DL_CH1 DL1_CH1' 1"
		cset "name='ADDA_DL_CH2 DL1_CH2' 1"
		cset "name='UL1_CH1 ADDA_UL_CH1' 1"
		cset "name='UL1_CH2 ADDA_UL_CH2' 1"
	]
	DisableSequence [
		cset "name='ADDA_DL_CH1 DL1_CH1' 0"
		cset "name='ADDA_DL_CH2 DL1_CH2' 0"
		cset "name='UL1_CH1 ADDA_UL_CH1' 0"
		cset "name='UL1_CH2 ADDA_UL_CH2' 0"
	]
	Value {
		TQ "Voice"
	}
}

# Receptor (RCV, saida do DAC esquerdo). O FixedBootSequence nao fixa o Handset_PGA_GAIN:
# o ganho vai para -2 dB (indice 10; 8 = 0 dB, 0 = +8 dB) com o mux aberto, e so entao a
# saida liga. Ganho alto no ouvido machuca.
SectionDevice."Earpiece" {
	Comment "Earpiece"
	ConflictingDevice [
		"Speaker"
		"Headphones"
	]
	EnableSequence [
		# A saida de linha (amplificador do alto-falante) pode ter ficado ligada pelo HiFi:
		# com ela aberta a voz saiu no viva-voz em vez do fone (visto no aparelho, 2026-10-15).
		cset "name='LOL Mux' Open"
		cset "name='RCV Mux' Open"
		cset "name='Handset_PGA_GAIN' 10"
		cset "name='RCV Mux' Voice Playback"
	]
	DisableSequence [
		cset "name='RCV Mux' Open"
	]
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 1
	}
}

# Viva-voz: o do HiFi com o sia81xx na cena "Voice", como o HAL faz na chamada. O
# amplificador liga e desliga pelo DAPM com o stream (fix-sia81xx-speaker-amp-dapm).
SectionDevice."Speaker" {
	Comment "Speaker"
	ConflictingDevice [
		"Earpiece"
		"Headphones"
	]
	EnableSequence [
		cset "name='LOL Mux' Open"
		cset "name='Lineout_PGAL_GAIN',device=4 10"
		cset "name='Lineout_PGAR_GAIN',device=5 10"
		cset "name='LOL Mux' Playback_L_DAC"
		cset "name='SpkrLeft Sia81xx Audio Scene' Voice"
		cset "name='Ext_Speaker_Amp Switch' on"
	]
	DisableSequence [
		cset "name='Ext_Speaker_Amp Switch' off"
		cset "name='LOL Mux' Open"
		cset "name='SpkrLeft Sia81xx Audio Scene' Playback"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 1
	}
}

# Fone com fio: o do HiFi. Para o MD, o thunder-speechd ainda manda ext_dev_info 0 (o
# HAL usa 6 com fone, por 0x2F2B): a voz sai, mas o eco/ganho do MD e o do receptor.
SectionDevice."Headphones" {
	Comment "Headphones"
	ConflictingDevice [
		"Earpiece"
		"Speaker"
	]
	EnableSequence [
		cset "name='HPL Mux' Open"
		cset "name='HPR Mux' Open"
		cset "name='Headset_PGAL_GAIN',device=2 9"
		cset "name='Headset_PGAR_GAIN',device=3 9"
		cset "name='HPL Mux' Audio Playback"
		cset "name='HPR Mux' Audio Playback"
	]
	DisableSequence [
		cset "name='HPL Mux' Open"
		cset "name='HPR Mux' Open"
	]
	Value {
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId},0"
		JackControl "Headphone Jack"
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphone"
	ConflictingDevice [
		"Headset"
	]
	EnableSequence [
		cset "name='PGA1 Volume' 2"
		cset "name='PGA_L_Mux' AIN0"
		cset "name='ADC_L_Mux' Left Preamplifier"
	]
	DisableSequence [
		cset "name='ADC_L_Mux' Idle"
		cset "name='PGA_L_Mux' None"
	]
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},10"
	}
}

SectionDevice."Headset" {
	Comment "Headset Microphone"
	ConflictingDevice [
		"Mic"
	]
	EnableSequence [
		cset "name='PGA1 Volume' 2"
		cset "name='PGA_L_Mux' AIN1"
		cset "name='ADC_L_Mux' Left Preamplifier"
	]
	DisableSequence [
		cset "name='ADC_L_Mux' Idle"
		cset "name='PGA_L_Mux' None"
	]
	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},10"
		JackControl "Headset Mic Jack"
	}
}

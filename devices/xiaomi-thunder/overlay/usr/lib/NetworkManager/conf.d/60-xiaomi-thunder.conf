# Wi-Fi do xiaomi-thunder (gen4m, driver de vendor). O NetworkManager so gerencia a
# wlan0 (51-thunder-wifi.conf); as outras interfaces do driver (wlan1, ap0, p2p0) ficam
# de fora por la.
[device-xiaomi-thunder-wlan0]
match-device=interface-name:wlan0
# O gen4m so troca o MAC com a interface desligada; sortear um MAC a cada scan nao foi
# validado nesse driver e pode derrubar o scan.
wifi.scan-rand-mac-address=no

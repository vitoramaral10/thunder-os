# Wi-Fi do xiaomi-thunder (gen4m, driver de vendor). O NetworkManager so gerencia a
# wlan0 (51-thunder-wifi.conf); as outras interfaces do driver (wlan1, ap0, p2p0) ficam
# de fora por la.
[device-xiaomi-thunder-wlan0]
match-device=interface-name:wlan0
# O gen4m so troca o MAC com a interface desligada; sortear um MAC a cada scan nao foi
# validado nesse driver e pode derrubar o scan.
wifi.scan-rand-mac-address=no

# PMF (802.11w) desligado por padrao: com o "opcional" do NetworkManager, um roteador
# WPA2/WPA3 (modo de transicao, MFPC=1) faz o driver recusar o connect do nl80211
# ("Association request to the driver failed" no wpa_supplicant), e a rede nunca
# associa; com PMF desligado associa na hora (medido em 2026-10-11). O wpa_supplicant
# sozinho, que o aparelho usava antes, ja vinha com PMF desligado. Custo: sem protecao
# contra deauth/disassoc forjados. Uma conexao que pede PMF obrigatorio continua pedindo.
# A causa no driver (qual -EINVAL do mtk_cfg80211_connect) ainda nao foi achada.
[connection-xiaomi-thunder-wlan0]
match-device=interface-name:wlan0
wifi-sec.pmf=1

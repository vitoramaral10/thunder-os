# Wi-Fi do xiaomi-thunder (gen4m, driver de vendor). O NetworkManager so gerencia a
# wlan0 (51-thunder-wifi.conf); as outras interfaces do driver (wlan1, ap0, p2p0) ficam
# de fora por la.
[device-xiaomi-thunder-wlan0]
match-device=interface-name:wlan0
# O gen4m so troca o MAC com a interface desligada; sortear um MAC a cada scan nao foi
# validado nesse driver e pode derrubar o scan.
wifi.scan-rand-mac-address=no

# PMF (802.11w) desligado por padrao. Com o PMF "opcional" do NetworkManager, num roteador
# WPA2/WPA3 (modo de transicao) o wpa_supplicant escolhe WPA3-SAE, e o SAE precisa da senha
# em texto; o thunder-wifi grava so a chave derivada (PSK de 64 hex), entao o SAE falha
# ("SAE: No password available") e a rede nunca associa. Com PMF desligado o SAE fica
# proibido e ele usa WPA2-PSK. O kernel aceita o WPA3 desde o patch
# backport-nl80211-wpa-version-3 (antes o nl80211 recusava com -EINVAL); um perfil com a
# senha em texto e PMF opcional conecta em WPA3-SAE (medido em 2026-10-13). Custo deste
# padrao: sem protecao contra deauth/disassoc forjados. Uma conexao que pede PMF
# obrigatorio continua pedindo.
[connection-xiaomi-thunder-wlan0]
match-device=interface-name:wlan0
wifi-sec.pmf=1

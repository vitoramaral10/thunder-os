# Wi-Fi do xiaomi-thunder (gen4m, driver de vendor). O NetworkManager so gerencia a
# wlan0 (51-thunder-wifi.conf); as outras interfaces do driver (wlan1, ap0, p2p0) ficam
# de fora por la.
[device-xiaomi-thunder-wlan0]
match-device=interface-name:wlan0
# O gen4m so troca o MAC com a interface desligada; sortear um MAC a cada scan nao foi
# validado nesse driver e pode derrubar o scan.
wifi.scan-rand-mac-address=no

# PMF (802.11w) desligado para perfil que nao diz o contrario. Os perfis do thunder-wifi
# guardam a senha e pedem PMF opcional (pmf=2) no proprio perfil: WPA3-SAE num roteador
# WPA2/WPA3 e protecao contra deauth/disassoc forjados. Este padrao fica para os perfis
# antigos, gravados so com a chave derivada (PSK de 64 hex): com PMF opcional o
# wpa_supplicant escolheria SAE, que precisa da senha ("SAE: No password available"), e a
# rede nunca associaria. Com PMF desligado o SAE fica proibido e eles usam WPA2-PSK. O
# kernel aceita o WPA3 desde o patch backport-nl80211-wpa-version-3 (antes o nl80211
# recusava com -EINVAL).
[connection-xiaomi-thunder-wlan0]
match-device=interface-name:wlan0
wifi-sec.pmf=1

# O driver de toque Novatek (NT36672C) cria estes controles com 0666: qualquer usuario
# ligava o modo bolso ou mudava a sensibilidade e deixava a tela sem toque. Os handlers
# so aceitam 2 bytes (sem bug de memoria); o que fecha e a permissao, so root escreve.
z /proc/nvt_max_power_switch   0644 root root -
z /proc/nvt_charger_switch     0644 root root -
z /proc/nvt_pocket_palm_switch 0644 root root -
z /proc/nvt_pf_switch          0644 root root -
z /proc/nvt_sensitivity_switch 0644 root root -

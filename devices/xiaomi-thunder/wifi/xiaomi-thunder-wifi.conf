# O driver gen4m cria wlan0, wlan1, ap0 e p2p0. So a wlan0 e estacao de
# verdade; sem isto o "nmcli dev wifi connect" pode amarrar o perfil na ap0
# e falhar com "The Wi-Fi network could not be found" mesmo com a rede no scan.
[keyfile]
unmanaged-devices=interface-name:ap0;interface-name:wlan1;interface-name:p2p0
